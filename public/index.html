<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat del Aula - WebSocket</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161922;
      --border: #262c3a;
      --accent: #4f9cf9;
      --accent2: #a78bfa;
      --green: #34d399;
      --red: #f87171;
      --text: #e2e8f0;
      --muted: #64748b;
      --bubble-mine: #1e3a5f;
      --bubble-other: #1e2535;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── Estado de conexión ── */
    #status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.3s;
    }

    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    #status.connected .dot   { background: var(--green); animation: pulse 2s infinite; }
    #status.disconnected .dot { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Card principal ── */
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    /* ── Zona de inputs ── */
    .inputs {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #12151d;
    }

    .inputs input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .inputs input:focus { border-color: var(--accent); }
    .inputs input::placeholder { color: var(--muted); }
    #username { max-width: 160px; }

    /* ── Chat box ── */
    #chat-box {
      height: 380px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Mensajes ── */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.mine   { align-self: flex-end; align-items: flex-end; }
    .msg.other  { align-self: flex-start; align-items: flex-start; }

    .msg .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.mine  .bubble { background: var(--bubble-mine);  border-bottom-right-radius: 3px; }
    .msg.other .bubble { background: var(--bubble-other); border-bottom-left-radius: 3px; }

    .msg .meta {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .msg .name { color: var(--accent2); font-weight: 700; }

    /* ── Aviso de sistema ── */
    .sys-msg {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      padding: 4px 0;
    }

    /* ── Barra de envío ── */
    .send-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: #12151d;
    }

    #message {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #message:focus { border-color: var(--accent); }
    #message::placeholder { color: var(--muted); }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover  { opacity: 0.88; }
    button:active { transform: scale(0.97); }

    /* ── Error toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--red);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Chat del Aula</h1>
    <div id="status" class="disconnected">
      <span class="dot"></span>
      <span id="status-text">Desconectado</span>
    </div>
  </header>

  <div class="card">

    <!-- Nombre de usuario -->
    <div class="inputs">
      <input id="username" type="text" placeholder="Tu nombre (ej: Ana)" maxlength="20" />
      <span style="color:var(--muted);align-self:center;font-size:0.8rem;">Ingresa tu nombre para chatear</span>
    </div>

    <!-- Mensajes -->
    <div id="chat-box">
      <p class="sys-msg">— Esperando conexión... —</p>
    </div>

    <!-- Envío -->
    <div class="send-bar">
      <input id="message" type="text" placeholder="Escribe un mensaje..." />
      <button onclick="sendMessage()">Enviar ➤</button>
    </div>

  </div>

  <!-- Toast de error -->
  <div id="toast"></div>

  <script>
    // ─── Conexión WebSocket ───────────────────────────────────────
    const socket = new WebSocket('ws://localhost:3000');

    const statusEl   = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const chatBox    = document.getElementById('chat-box');

    socket.onopen = () => {
      statusEl.className = 'connected';
      statusText.textContent = 'Conectado al servidor';
      addSysMsg('✅ Conectado al servidor WebSocket');
    };

    socket.onmessage = (event) => {
      const raw  = event.data;                    // "Nombre: texto"
      const sep  = raw.indexOf(': ');
      const from = sep !== -1 ? raw.slice(0, sep) : 'Desconocido';
      const text = sep !== -1 ? raw.slice(sep + 2) : raw;

      const myName = document.getElementById('username').value.trim();
      const isMine = (from === myName);

      addMessage(from, text, isMine);
    };

    socket.onclose = () => {
      statusEl.className = 'disconnected';
      statusText.textContent = 'Desconectado';
      addSysMsg('❌ Conexión cerrada con el servidor');
    };

    socket.onerror = () => {
      addSysMsg('⚠️ Error de conexión');
    };

    // ─── Enviar mensaje ──────────────────────────────────────────
    function sendMessage() {
      const usernameInput = document.getElementById('username');
      const messageInput  = document.getElementById('message');

      const username = usernameInput.value.trim();
      const message  = messageInput.value.trim();

      // Validación: campos vacíos (Parte B del docente)
      if (username === '') {
        showToast('⚠️ Debes ingresar tu nombre.');
        usernameInput.focus();
        return;
      }

      if (message === '') {
        showToast('⚠️ No puedes enviar un mensaje vacío.');
        messageInput.focus();
        return;
      }

      if (socket.readyState !== WebSocket.OPEN) {
        showToast('❌ Sin conexión al servidor.');
        return;
      }

      const finalMessage = username + ': ' + message;
      socket.send(finalMessage);

      // Limpiar campo de mensaje (Mejora opcional del docente)
      messageInput.value = '';
      messageInput.focus();
    }

    // ─── Enter para enviar ───────────────────────────────────────
    document.getElementById('message').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // ─── Helpers ─────────────────────────────────────────────────
    function addMessage(from, text, isMine) {
      const now  = new Date();
      const hour = now.getHours().toString().padStart(2, '0');
      const min  = now.getMinutes().toString().padStart(2, '0');
      const time = `${hour}:${min}`;

      const div = document.createElement('div');
      div.className = 'msg ' + (isMine ? 'mine' : 'other');
      div.innerHTML = `
        <div class="bubble">${escapeHTML(text)}</div>
        <div class="meta">
          <span class="name">${escapeHTML(from)}</span> · ${time}
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSysMsg(text) {
      const p = document.createElement('p');
      p.className = 'sys-msg';
      p.textContent = text;
      chatBox.appendChild(p);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
